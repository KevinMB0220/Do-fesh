dataset:
  name: "SECOP II - Contratos Electrónicos"
  id: "jbjy-vk9h"
  csv_endpoint: "https://www.datos.gov.co/resource/jbjy-vk9h.csv"
  json_endpoint: "https://www.datos.gov.co/resource/jbjy-vk9h.json"
  default_limit: 5000
  default_department: "Antioquia"

safe_fields:
  - nombre_entidad
  - nit_entidad
  - departamento
  - ciudad
  - orden
  - sector
  - proceso_de_compra
  - id_contrato
  - referencia_del_contrato
  - estado_contrato
  - codigo_de_categoria_principal
  - descripcion_del_proceso
  - tipo_de_contrato
  - modalidad_de_contratacion
  - justificacion_modalidad_de
  - fecha_de_firma
  - fecha_de_inicio_del_contrato
  - fecha_de_fin_del_contrato
  - proveedor_adjudicado
  - codigo_proveedor
  - valor_del_contrato
  - valor_pagado
  - dias_adicionados
  - urlproceso
  - objeto_del_contrato
  - ultima_actualizacion
